<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0&icon_names=bigtop_updates,expand_circle_down,expand_circle_up,family_restroom,local_see,location_city,work&disply=block"
    />
    <link rel="stylesheet" href="index.css" />
    <link rel="stylesheet" href="global-nav.css" />
    <title>初めてのWebページ</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  </head>

  <body>
    <header>
      <div class="navbar-container">
        <div class="logo">
          <img src="logo.png" height="130" alt="巴里市ロゴ" />
        </div>
        <div class="search-bar">
          <form action="#" method="post">
            <input type="text" name="name" class="search-textbox" />
            <button type="submit" class="search-btn">検索</button>
          </form>
        </div>
      </div>
    </header>
    <div>
      <div class="slide">
        <ul class="slide-items">
          <li><img src="heatstroke.png" alt="熱中症予防" /></li>
          <li><img src="1.png" alt="" /></li>
          <li><img src="2.png" alt="" /></li>
        </ul>
      </div>
    </div>
    <nav class="global-nav-container">
      <ul class="global-nav-box">
        <li class="global-nav item-container">
          <a class="global-nav item-link" href="#">
            <div class="global-nav content-container">
              <span class="material-symbols-outlined global-nav content-icon">
                family_restroom
              </span>
            </div>
          </a>
        </li>
        <li class="global-nav item-container">
          <a class="global-nav item-link" href="#">
            <div class="global-nav content-container">
              <span class="material-symbols-outlined global-nav content-icon">
                location_city
              </span>
            </div>
          </a>
        </li>
        <li class="global-nav item-container">
          <a class="global-nav item-link" href="#">
            <div class="global-nav content-container">
              <span class="material-symbols-outlined global-nav content-icon">
                bigtop_updates
              </span>
            </div>
          </a>
        </li>
        <li class="global-nav item-container">
          <a class="global-nav item-link" href="#">
            <div class="global-nav content-container">
              <span class="material-symbols-outlined global-nav content-icon">
                local_see
              </span>
            </div>
          </a>
        </li>
        <li class="global-nav item-container">
          <a class="global-nav item-link" href="#">
            <div class="global-nav content-container">
              <span class="material-symbols-outlined global-nav content-icon">
                work
              </span>
            </div>
          </a>
        </li>
      </ul>
    </nav>

    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"
    ></script>
    <script>
      $(".slide-items").slick({
        fade: true,
        arrows: true,
        prevArrow:
          '<div class="slide-arrow prev-arrow"><div class="prev-arrow-triangle"></div></div>',
        nextArrow:
          '<div class="slide-arrow next-arrow"><div class="next-arrow-triangle"></div>',
      });
    </script>
  </body>
</html>
